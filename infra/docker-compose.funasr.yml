services:
  web:
    environment:
      FUNASR_API_BASE: http://speech-worker:8000
      FUNASR_MODEL: custom
    depends_on:
      speech-worker:
        condition: service_healthy

  speech-worker:
    build:
      context: ..
      dockerfile: services/speech-worker/Dockerfile
    networks:
      - backend
    environment:
      HOME: /tmp
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 3g
    cpus: 2
    restart: unless-stopped
