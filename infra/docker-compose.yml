name: resume-analysis-assistant

services:
  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    environment:
      DOCUMENT_WORKER_URL: http://worker:8000
      DATA_RETENTION_HOURS: ${DATA_RETENTION_HOURS:-24}
      AI_PROVIDER: ${AI_PROVIDER:-baseline}
      AI_API_BASE: ${AI_API_BASE:-https://yunwu.ai/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5.5}
      AI_RATE_LIMIT_ANALYSIS_PER_HOUR: ${AI_RATE_LIMIT_ANALYSIS_PER_HOUR:-10}
      AI_RATE_LIMIT_JD_PER_HOUR: ${AI_RATE_LIMIT_JD_PER_HOUR:-20}
      AI_RATE_LIMIT_INTERVIEW_PER_HOUR: ${AI_RATE_LIMIT_INTERVIEW_PER_HOUR:-60}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      worker:
        condition: service_healthy
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: services/document-worker/Dockerfile
      args:
        INSTALL_PADDLE_OCR: ${INSTALL_PADDLE_OCR:-false}
    environment:
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      TESSERACT_LANGUAGE: chi_sim+eng
      PADDLEOCR_ALLOW_MODEL_DOWNLOAD: "false"
      PADDLEOCR_DET_MODEL_DIR: /models/paddleocr/detection
      PADDLEOCR_REC_MODEL_DIR: /models/paddleocr/recognition
    # The worker remains isolated; worker-loopback is the sole host ingress.
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/.cache:size=32m,uid=10001,gid=10001
    volumes:
      - paddle_models:/models/paddleocr:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1536m
    cpus: 1.5
    restart: unless-stopped

  worker-loopback:
    image: python:3.12.11-slim-bookworm
    command: ["python", "/proxy/worker-loopback-proxy.py"]
    environment:
      LISTEN_PORT: "8001"
      UPSTREAM_HOST: worker
      UPSTREAM_PORT: "8000"
      CONNECT_TIMEOUT_SECONDS: ${WORKER_PROXY_CONNECT_TIMEOUT_SECONDS:-5}
      IDLE_TIMEOUT_SECONDS: ${WORKER_PROXY_IDLE_TIMEOUT_SECONDS:-240}
      MAX_CONNECTIONS: ${WORKER_PROXY_MAX_CONNECTIONS:-32}
    ports:
      - "127.0.0.1:${DOCUMENT_WORKER_PORT:-8001}:8001"
    depends_on:
      worker:
        condition: service_healthy
    networks:
      - edge
      - backend
    read_only: true
    user: "65534:65534"
    volumes:
      - ./worker-loopback-proxy.py:/proxy/worker-loopback-proxy.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    restart: unless-stopped

  postgres:
    profiles: ["future-infra"]
    image: pgvector/pgvector:pg16-bookworm
    environment:
      POSTGRES_DB: resume
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume -d resume"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  redis:
    profiles: ["future-infra"]
    image: redis:7.4.2-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-resume_dev}",
      ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a '${REDIS_PASSWORD:-resume_dev}' ping | grep PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  minio:
    profiles: ["future-infra"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-resume_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-resume_minio_dev}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  paddle_models:

networks:
  edge:
  backend:
    internal: true
